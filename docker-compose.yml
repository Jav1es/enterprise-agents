# ===== Enterprise Agent 本地多服务编排 =====
services:
  agent-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_API_KEY: ${LLM_API_KEY:-YOUR_LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://agent:Agent2026!@postgres:5432/agent
      VECTOR_STORE: chroma
      CHROMA_PERSIST_DIR: /app/data/chroma
      # ==== OpenTelemetry 全链路可观测性（OTLP -> Jaeger）====
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: enterprise-agent
      OTEL_TRACES_EXPORTER: otlp
    volumes:
      - chroma-data:/app/data/chroma
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  # ==== Jaeger 全链路追踪（16686 控制台 + 4317 gRPC + 4318 OTLP HTTP）====
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: YOUR_DB_PASSWORD
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  chroma-data:
