[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-mcp"
version = "0.1.0"
description = "MCP Server：作品集模块查询与检索（list_modules / search_portfolio / get_item_detail），资源 + 面试口播提示模板"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jav1es" },
]
keywords = ["mcp", "agent", "llm", "portfolio", "作品集", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # 使用 mcp 1.x 的 FastMCP API（2.x 已将 FastMCP 重命名为 MCPServer，破坏性变更）
    "mcp>=1.2.0,<2",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
portfolio-mcp = "portfolio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
