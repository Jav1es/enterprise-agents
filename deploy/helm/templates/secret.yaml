{{- /* PostgreSQL 密码：优先用已有 Secret，否则本 Chart 建一个 */ -}}
{{- if and .Values.dependencies.postgres.enabled (not .Values.dependencies.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: enterprise-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPasswordValue | default (randAlphaNum 24) | b64enc | quote }}
{{- end }}